<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFS Service Center — Staff Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="signin-wrap" id="signin-wrap">
  <div class="signin-card">
    <h1>Staff Admin</h1>
    <p id="signin-copy">Sign in with your Google account to manage the Service Center's sections and links.</p>
    <button class="google-btn" id="google-signin-btn">Sign in with Google</button>
    <p class="denied-note" id="denied-note"></p>
  </div>
</div>

<div class="admin-shell" id="admin-shell" hidden>
  <div class="admin-topbar">
    <span class="who" id="who-label"></span>
    <div style="display:flex; gap:1rem; align-items:center;">
      <a class="view-site" href="index.html" target="_blank" rel="noopener">View live site ↗</a>
      <button class="sign-out-btn" id="sign-out-btn">Sign Out</button>
    </div>
  </div>

  <main class="admin-main">
    <!-- Sections -->
    <div class="admin-section-block">
      <h2>Sections</h2>
      <div id="sections-list"></div>
      <form id="add-section-form" style="margin-top:1rem; border-top:1px solid var(--border); padding-top:1rem;">
        <div class="field-row">
          <div class="field" style="flex:0 0 80px;">
            <label for="new-sec-icon">Icon</label>
            <input id="new-sec-icon" maxlength="4" placeholder="🔗">
          </div>
          <div class="field" style="flex:1;">
            <label for="new-sec-name">Section name</label>
            <input id="new-sec-name" required placeholder="e.g. Athletics">
          </div>
        </div>
        <button class="btn-primary" type="submit">+ Add Section</button>
      </form>
    </div>

    <!-- Cards -->
    <div class="admin-section-block">
      <h2>Links &amp; Cards</h2>
      <div id="cards-by-section"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import {
    GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
  import {
    collection, query, orderBy, onSnapshot, doc, getDoc, addDoc, updateDoc, deleteDoc
  } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

  const signinWrap = document.getElementById('signin-wrap');
  const signinCopy = document.getElementById('signin-copy');
  const deniedNote = document.getElementById('denied-note');
  const googleBtn = document.getElementById('google-signin-btn');
  const adminShell = document.getElementById('admin-shell');
  const whoLabel = document.getElementById('who-label');
  const signOutBtn = document.getElementById('sign-out-btn');
  const sectionsList = document.getElementById('sections-list');
  const addSectionForm = document.getElementById('add-section-form');
  const cardsBySectionEl = document.getElementById('cards-by-section');
  const toast = document.getElementById('toast');

  let toastTimer = null;
  function showToast(msg, isError) {
    toast.textContent = msg;
    toast.classList.toggle('toast-error', !!isError);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  googleBtn.addEventListener('click', async () => {
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (err) {
      console.error(err);
      showToast('Sign-in failed — please try again.', true);
    }
  });
  signOutBtn.addEventListener('click', () => signOut(auth));

  let sections = [];
  let cardsBySection = {};
  let unsubSections = null, unsubCards = null;

  onAuthStateChanged(auth, async (user) => {
    if (unsubSections) { unsubSections(); unsubSections = null; }
    if (unsubCards) { unsubCards(); unsubCards = null; }

    if (!user) {
      adminShell.hidden = true;
      signinWrap.hidden = false;
      deniedNote.classList.remove('show');
      signinCopy.textContent = "Sign in with your Google account to manage the Service Center's sections and links.";
      return;
    }

    let isAdmin = false;
    try {
      const snap = await getDoc(doc(db, 'admins', user.email));
      isAdmin = snap.exists();
    } catch (err) {
      console.error('admin check failed', err);
    }

    if (!isAdmin) {
      adminShell.hidden = true;
      signinWrap.hidden = false;
      signinCopy.textContent = "You're signed in, but this account doesn't have admin access.";
      deniedNote.textContent = `Signed in as ${user.email}. Ask an existing admin to add this exact email to the "admins" collection in Firestore, then reload this page.`;
      deniedNote.classList.add('show');
      return;
    }

    signinWrap.hidden = true;
    adminShell.hidden = false;
    whoLabel.textContent = `Signed in as ${user.email}`;
    subscribeData();
  });

  function subscribeData() {
    const sectionsQuery = query(collection(db, 'sections'), orderBy('order'));
    unsubSections = onSnapshot(sectionsQuery, (snap) => {
      sections = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderSections();
      renderCards();
    });

    const cardsQuery = query(collection(db, 'cards'), orderBy('order'));
    unsubCards = onSnapshot(cardsQuery, (snap) => {
      const grouped = {};
      snap.docs.forEach(d => {
        const c = { id: d.id, ...d.data() };
        if (!grouped[c.sectionId]) grouped[c.sectionId] = [];
        grouped[c.sectionId].push(c);
      });
      cardsBySection = grouped;
      renderCards();
    });
  }

  // ---------- sections ----------
  function renderSections() {
    if (!sections.length) {
      sectionsList.innerHTML = '<p style="color:var(--text-muted); font-size:.88rem;">No sections yet — add one below.</p>';
      return;
    }
    sectionsList.innerHTML = sections.map((s, i) => `
      <div class="section-row">
        <span class="sec-icon">${escapeHtml(s.icon || '🔗')}</span>
        <span class="sec-name">${escapeHtml(s.name)}</span>
        <div class="row-actions">
          <button class="icon-btn" data-act="sec-up" data-id="${s.id}" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
          <button class="icon-btn" data-act="sec-down" data-id="${s.id}" ${i === sections.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
          <button class="icon-btn" data-act="sec-edit" data-id="${s.id}" title="Rename">✎</button>
          <button class="icon-btn danger" data-act="sec-delete" data-id="${s.id}" title="Delete">🗑</button>
        </div>
      </div>`).join('');

    sectionsList.querySelectorAll('[data-act="sec-up"]').forEach(b => b.onclick = () => moveSection(b.dataset.id, -1));
    sectionsList.querySelectorAll('[data-act="sec-down"]').forEach(b => b.onclick = () => moveSection(b.dataset.id, 1));
    sectionsList.querySelectorAll('[data-act="sec-edit"]').forEach(b => b.onclick = () => editSectionPrompt(b.dataset.id));
    sectionsList.querySelectorAll('[data-act="sec-delete"]').forEach(b => b.onclick = () => deleteSection(b.dataset.id));
  }

  addSectionForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nameInput = document.getElementById('new-sec-name');
    const iconInput = document.getElementById('new-sec-icon');
    const name = nameInput.value.trim();
    if (!name) return;
    const maxOrder = sections.reduce((m, s) => Math.max(m, s.order || 0), 0);
    try {
      await addDoc(collection(db, 'sections'), {
        name, icon: iconInput.value.trim() || '🔗', order: maxOrder + 10
      });
      nameInput.value = ''; iconInput.value = '';
      showToast('Section added.');
    } catch (err) {
      showToast('Could not add section — check your admin access.', true);
    }
  });

  async function editSectionPrompt(id) {
    const s = sections.find(x => x.id === id);
    if (!s) return;
    const name = prompt('Section name:', s.name);
    if (name === null) return;
    const icon = prompt('Icon (emoji):', s.icon || '🔗');
    if (icon === null) return;
    try {
      await updateDoc(doc(db, 'sections', id), { name: name.trim() || s.name, icon: icon.trim() || '🔗' });
      showToast('Section updated.');
    } catch (err) {
      showToast('Could not update section.', true);
    }
  }

  async function deleteSection(id) {
    const cards = cardsBySection[id] || [];
    if (cards.length) {
      showToast(`Move or delete this section's ${cards.length} card(s) first.`, true);
      return;
    }
    if (!confirm('Delete this section?')) return;
    try {
      await deleteDoc(doc(db, 'sections', id));
      showToast('Section deleted.');
    } catch (err) {
      showToast('Could not delete section.', true);
    }
  }

  async function moveSection(id, dir) {
    const idx = sections.findIndex(s => s.id === id);
    const swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= sections.length) return;
    const a = sections[idx], b = sections[swapIdx];
    try {
      await updateDoc(doc(db, 'sections', a.id), { order: b.order });
      await updateDoc(doc(db, 'sections', b.id), { order: a.order });
    } catch (err) {
      showToast('Could not reorder sections.', true);
    }
  }

  // ---------- cards ----------
  function renderCards() {
    if (!sections.length) { cardsBySectionEl.innerHTML = ''; return; }
    cardsBySectionEl.innerHTML = sections.map(s => {
      const cards = cardsBySection[s.id] || [];
      return `
        <div style="margin-bottom:1.6rem;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:.6rem;">
            <strong style="font-family:'Barlow Semi Condensed',sans-serif; text-transform:uppercase; letter-spacing:.03em; color:var(--heading);">
              ${escapeHtml(s.icon || '🔗')} ${escapeHtml(s.name)}
            </strong>
            <button class="btn-ghost" type="button" data-act="card-add" data-section="${s.id}">+ Add Card</button>
          </div>
          <div class="card-admin-list">
            ${cards.length ? cards.map((c, i) => `
              <div class="card-admin-row" ${c.hidden ? 'style="opacity:.55;"' : ''}>
                <span class="ca-icon">${escapeHtml(c.icon || '🔗')}</span>
                <div class="ca-body">
                  <div class="ca-title">${escapeHtml(c.title || 'Untitled')} ${c.audience && c.audience !== 'all' ? `<span class="tag tag-${c.audience}">${c.audience}</span>` : ''} ${c.hidden ? '<span class="tag" style="background:var(--surface-2); color:var(--text-muted);">Hidden</span>' : ''}</div>
                  <div class="ca-meta">${escapeHtml(c.url || '')}</div>
                </div>
                <div class="row-actions">
                  <button class="icon-btn" data-act="card-toggle-visible" data-id="${c.id}" data-hidden="${c.hidden ? '1' : '0'}" title="${c.hidden ? 'Show on site' : 'Hide from site'}">${c.hidden ? '🙈' : '👁'}</button>
                  <button class="icon-btn" data-act="card-up" data-id="${c.id}" data-section="${s.id}" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
                  <button class="icon-btn" data-act="card-down" data-id="${c.id}" data-section="${s.id}" ${i === cards.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
                  <button class="icon-btn" data-act="card-edit" data-id="${c.id}" title="Edit">✎</button>
                  <button class="icon-btn danger" data-act="card-delete" data-id="${c.id}" title="Delete">🗑</button>
                </div>
              </div>`).join('') : '<p style="color:var(--text-muted); font-size:.85rem;">No cards yet.</p>'}
          </div>
        </div>`;
    }).join('');

    cardsBySectionEl.querySelectorAll('[data-act="card-add"]').forEach(b => b.onclick = () => openCardForm({ mode: 'create', sectionId: b.dataset.section }));
    cardsBySectionEl.querySelectorAll('[data-act="card-edit"]').forEach(b => b.onclick = () => openCardForm({ mode: 'edit', id: b.dataset.id }));
    cardsBySectionEl.querySelectorAll('[data-act="card-delete"]').forEach(b => b.onclick = () => deleteCard(b.dataset.id));
    cardsBySectionEl.querySelectorAll('[data-act="card-up"]').forEach(b => b.onclick = () => moveCard(b.dataset.id, b.dataset.section, -1));
    cardsBySectionEl.querySelectorAll('[data-act="card-down"]').forEach(b => b.onclick = () => moveCard(b.dataset.id, b.dataset.section, 1));
    cardsBySectionEl.querySelectorAll('[data-act="card-toggle-visible"]').forEach(b => b.onclick = () => toggleCardVisibility(b.dataset.id, b.dataset.hidden === '1'));
  }

  async function toggleCardVisibility(id, currentlyHidden) {
    try {
      await updateDoc(doc(db, 'cards', id), { hidden: !currentlyHidden });
      showToast(currentlyHidden ? 'Card is now visible on the site.' : 'Card hidden from the site.');
    } catch (err) {
      showToast('Could not change visibility.', true);
    }
  }

  async function moveCard(id, sectionId, dir) {
    const list = cardsBySection[sectionId] || [];
    const idx = list.findIndex(c => c.id === id);
    const swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= list.length) return;
    const a = list[idx], b = list[swapIdx];
    try {
      await updateDoc(doc(db, 'cards', a.id), { order: b.order });
      await updateDoc(doc(db, 'cards', b.id), { order: a.order });
    } catch (err) {
      showToast('Could not reorder cards.', true);
    }
  }

  async function deleteCard(id) {
    if (!confirm('Delete this card?')) return;
    try {
      await deleteDoc(doc(db, 'cards', id));
      showToast('Card deleted.');
    } catch (err) {
      showToast('Could not delete card.', true);
    }
  }

  // simple inline card form built on the fly
  function findCard(id) {
    for (const sid in cardsBySection) {
      const found = (cardsBySection[sid] || []).find(c => c.id === id);
      if (found) return found;
    }
    return null;
  }

  function openCardForm({ mode, sectionId, id }) {
    const existing = mode === 'edit' ? findCard(id) : null;
    const overlay = document.createElement('div');
    overlay.className = 'signin-wrap';
    overlay.style.cssText = 'position:fixed; inset:0; background:rgba(20,14,10,.55); z-index:50; min-height:100vh;';
    overlay.innerHTML = `
      <form class="signin-card" style="text-align:left; max-width:440px;">
        <h1 style="font-size:1.4rem;">${mode === 'edit' ? 'Edit Card' : 'Add Card'}</h1>
        <div class="field">
          <label>Title</label>
          <input name="title" required maxlength="80" value="${escapeHtml(existing?.title || '')}">
        </div>
        <div class="field">
          <label>Description</label>
          <textarea name="description" maxlength="200">${escapeHtml(existing?.description || '')}</textarea>
        </div>
        <div class="field">
          <label>URL</label>
          <input name="url" placeholder="https://" value="${escapeHtml(existing?.url || '')}">
        </div>
        <p class="field-hint">For a PDF or document: upload it to Google Drive, set sharing to "Anyone with the link," and paste that link here.</p>
        <div class="field-row">
          <div class="field" style="flex:0 0 90px;">
            <label>Icon</label>
            <input name="icon" maxlength="4" placeholder="🔗" value="${escapeHtml(existing?.icon || '')}">
          </div>
          <div class="field">
            <label>Visible to</label>
            <select name="audience">
              <option value="all">Everyone</option>
              <option value="student">Students only</option>
              <option value="faculty">Faculty only</option>
            </select>
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:.6rem; margin-top:.6rem;">
          <button type="button" class="btn-ghost" data-act="cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>`;
    document.body.appendChild(overlay);

    const form = overlay.querySelector('form');
    if (existing?.audience) form.audience.value = existing.audience;

    overlay.querySelector('[data-act="cancel"]').onclick = () => overlay.remove();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        const url = form.url.value.trim();
        const payload = {
          title: form.title.value.trim().slice(0, 80) || 'Untitled link',
          description: form.description.value.trim().slice(0, 200),
          url: url || '#',
          icon: form.icon.value.trim().slice(0, 4) || '🔗',
          audience: form.audience.value,
        };
        if (mode === 'create') {
          const list = cardsBySection[sectionId] || [];
          const maxOrder = list.reduce((m, c) => Math.max(m, c.order || 0), 0);
          await addDoc(collection(db, 'cards'), { ...payload, sectionId, order: maxOrder + 10 });
          showToast('Card added.');
        } else {
          await updateDoc(doc(db, 'cards', id), payload);
          showToast('Card updated.');
        }
        overlay.remove();
      } catch (err) {
        console.error(err);
        showToast('Could not save this card — check your admin access.', true);
        submitBtn.disabled = false;
      }
    });
  }

</script>
</body>
</html>
